[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bndocvqa"
version = "0.1.0"
description = "Bangla Document VQA benchmark dataset builder"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "PyMuPDF>=1.24", "Pillow>=10.0", "openpyxl>=3.1", "google-genai>=1.0", "keyring>=24", "tzdata>=2024.1; platform_system == 'Windows'"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
bndocvqa = "bndocvqa.cli:main"

[tool.setuptools.packages.find]
include = ["bndocvqa*"]

[tool.setuptools.package-data]
bndocvqa = ["database/migrations/*.sql", "ui/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
